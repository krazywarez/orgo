[package]
name = "org-ssg"
version = "0.11.0"
edition = "2021"
description = "Org-mode static site generator that renders the org element tree straight to HTML"
license = "MIT"

[lib]
name = "org_ssg"
path = "src/lib.rs"

[[bin]]
name = "org-ssg"
path = "src/main.rs"

[dependencies]
# Parsing / model
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
camino = { version = "1", features = ["serde1"] }

# Pipeline
walkdir = "2"
syntect = "5"
minijinja = "2"
blake3 = "1"

# CLI / errors
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
rayon = "1.12.0"
toml = "1.1.4"
notify = "8.2.0"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
